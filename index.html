<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paisaje Emocional — silvia & the spyglass</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="header-left">
            <div class="eyebrow">
                silvia & the spyglass / ARTE Y NEUROCIENCIA II
            </div>
            <h1>
                Paisaje Emocional
            </h1>
        </div>

        <div class="header-info">
            56 OBRAS · 100 PARTICIPANTES
            <br>
            EEG · GSR · HR
        </div>
    </header>

    <main>
        <section class="map-container">
            <canvas id="emotionCanvas"></canvas>
            <div id="artworkLayer"></div>
        </section>

        <nav
            class="emotion-filter"
            aria-label="Filtrar por emoción"
        >
            <button class="emotion active" data-emotion="all">todas</button>
            <button class="emotion" data-emotion="Alegría">alegría</button>
            <button class="emotion" data-emotion="Confianza">confianza</button>
            <button class="emotion" data-emotion="Curiosidad">curiosidad</button>
            <button class="emotion" data-emotion="Sorpresa">sorpresa</button>
            <button class="emotion" data-emotion="Disgusto">disgusto</button>
            <button class="emotion" data-emotion="Ira">ira</button>
            <button class="emotion" data-emotion="Miedo">miedo</button>
            <button class="emotion" data-emotion="Tristeza">tristeza</button>
        </nav>

        <aside id="artworkInfo" class="artwork-info">
            <button
                id="closeInfo"
                class="close-info"
                aria-label="Cerrar"
            >
                ×
            </button>

            <div class="info-label">
                OBRA
            </div>

            <h2 id="artworkTitle"></h2>

            <div id="emotionValues"></div>
        </aside>
    </main>

    <script src="script.js"></script>
</body>
</html>
